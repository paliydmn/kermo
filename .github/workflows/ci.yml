name: CI

on:
  push:
    branches: [master]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}   # every master run finishes

jobs:
  test:
    # Xcode 27's image: the Swift Kermo is built with (Apple Silicon only).
    runs-on: xcode-27
    timeout-minutes: 45
    env:
      DFM_TEST_SLOW: 3   # a shared runner: the tests' `until` waits last three times longer
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - run: python3 tools/check-docs.py
      - run: swift --version
      - run: swift build --build-tests   # the tests' 10 minutes below are for tests, not their build
      # The tests' files in a folder with no link on its path, as test.sh's disks are: /var/folders is /private/var/…
      # to a shell or git and /var/… to resolvingSymlinksInPath, and tests comparing the two failed.
      - run: echo "DFM_TEST_TMP=$RUNNER_TEMP" >> "$GITHUB_ENV"
      # A run still going after 10 minutes is stuck: the test process's stacks go to the log (they name the test and
      # the line it waits on), then it's stopped.
      - name: Core tests
        timeout-minutes: 15
        run: |
          ./test.sh --filter DFMCoreTests & t=$!
          ( sleep 600; echo "::error::Core tests still running after 10 minutes: stacks below"
            for p in $(pgrep -f '\.xctest'); do sample "$p" 3 -file "/tmp/stacks-$p.txt" >/dev/null && cat "/tmp/stacks-$p.txt"; done
            kill $t 2>/dev/null; pkill -f '\.xctest' || true ) & w=$!
          s=0; wait $t || s=$?
          kill $w 2>/dev/null || true
          exit $s
      # The app's tests want a window server, the Keychain and an idle machine: their result is shown, not required.
      # In a session of their own: a signal to the tests' process group can't reach the runner (runs ended mid-way, exit 0,
      # no summary). A run with no summary fails and names the tests that started and never ended.
      - name: App tests
        continue-on-error: true
        timeout-minutes: 25
        shell: bash
        run: |
          set -o pipefail
          s=0; perl -MPOSIX -e 'POSIX::setsid(); exec @ARGV' ./test.sh --filter DFileManagerTests 2>&1 | tee "$RUNNER_TEMP/app.log" || s=$?
          if ! grep -q 'Test run with' "$RUNNER_TEMP/app.log"; then
            echo "::error::App tests ended with no summary (exit $s). Started and not ended:"
            LC_ALL=C sed -nE 's/.*Test ([A-Za-z0-9_]+)\(.*\) started.*/\1/p' "$RUNNER_TEMP/app.log" | sort > "$RUNNER_TEMP/started"
            LC_ALL=C sed -nE 's/.*Test ([A-Za-z0-9_]+)\(.*\).* (passed|failed|skipped).*/\1/p' "$RUNNER_TEMP/app.log" | sort -u > "$RUNNER_TEMP/ended"
            comm -23 "$RUNNER_TEMP/started" "$RUNNER_TEMP/ended"
            exit 1
          fi
          exit $s
